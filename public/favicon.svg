<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100" height="100" fill="#0a0e17"/>
  
  <text x="50" y="42" font-family="'Bebas Neue', sans-serif" font-size="24" font-weight="bold" fill="#ff4d6a" text-anchor="middle" filter="url(#glow)">NOVA</text>
  <text x="50" y="72" font-family="'Bebas Neue', sans-serif" font-size="22" font-weight="bold" fill="#00e5ff" text-anchor="middle" filter="url(#glow)">CITY</text>
</svg>