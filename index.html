            <p>Nova City is a living, breathing cyber-metropolis consisting of multiple distinctive districts. Get to know each sector before diving into parkour traversal on global release:</p>
            <ul style="padding-left: 20px; margin-bottom: 20px; list-style-type: square;">
              <li style="margin-bottom: 15px;">
                <strong style="color: #fff;">せきそくく (Sunset Speed District / 夕速区):</strong>
                An absolute paradise for high-speed thrills and street adrenaline. This sector is the ultimate sanctuary for local underground street racers, drift masters, and parkour thrill-seekers looking to master motorcycle mechanics and narrow alley shortcuts.
              </li>
              <li style="margin-bottom: 15px;">
                <strong style="color: #fff;">じょうちゅうく (Castle City / 城中区):</strong>
                The economic gravity center of Nova City, characterized by soaring skyscrapers, corporate mega-towers, and gleaming glass facades. Serving as the focal point of the main storyline, this district is optimized for breathtaking high-altitude grappling hook actions and vertical climbing.
              </li>
              <li style="margin-bottom: 15px;">
                <strong style="color: #fff;">しんがんく (New Coast / 新岸区):</strong>
                The cultural intersection of futuristic technologies, contemporary youth fashion, cyber subcultures, and creative street art. It is populated by high-interaction NPC creators, trending gadget boutiques, and neon cafes representing urban lifestyle.
              </li>
              <li style="margin-bottom: 15px;">
                <strong style="color: #fff;">せんはくこう (Senhaku Lane / 千泊巷):</strong>
                A retro-styled dense residential labyrinth where everyday life, local food stalls, and warm traditional architecture merge. Behind its narrow alleyways lie dynamic urban legends, hidden quests, and the heartwarming daily pulse of Nova City's citizens.
              </li>
              <li style="margin-bottom: 15px;">
                <strong style="color: #fff;">ひんかいく (Binhai Beach / 浜海区):</strong>
                A gorgeous coastal resort lined with sun-drenched beaches, scenic oceanic views, and boardwalks. This district serves as a premier venue for social activities, multiplayer co-op check-ins, and high-speed marine vehicle trials.
              </li>
              <li style="margin-bottom: 15px;">
                <strong style="color: #fff;">みらいこう (Future Port / 未来港):</strong>
                A sprawling industrial container yard and heavy-machinery harbor. It acts as a industrial playground featuring hazardous obstacle courses, heavy truck driving mechanics, and tactical showdowns against anomalous security constructs.
              </li>
